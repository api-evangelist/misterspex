name: MisterSpex
description: >-
  Mister Spex SE is a European online-first eyewear and optical retailer selling
  prescription glasses, sunglasses, and contact lenses across more than 100 premium,
  luxury, independent, and private-label brands. Founded in Berlin in 2007 and listed
  on the Frankfurt Stock Exchange, the company serves more than 8 million customers
  online in five countries and operates 65 stores in Germany plus a network of over
  300 partner opticians. It was surfaced as a portfolio company of Point Nine and
  added to the API Evangelist network; the company publishes no public consumer or
  developer API, so this profile captures corporate identity and security-surface
  artifacts derived from live probes rather than an API catalog.
